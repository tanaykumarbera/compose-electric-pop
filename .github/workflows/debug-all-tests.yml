name: Debug allTests (temp)

# Only fires on this debug branch. Do NOT merge to main.
on:
  push:
    branches: ["chore/debug-ios-tests"]
  workflow_dispatch:

jobs:
  all-tests-macos:
    name: allTests on macOS (with diagnostics)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run :library:allTests with stacktrace + continue
        run: |
          ./gradlew :library:allTests \
            --stacktrace --info --continue \
            -Dorg.gradle.daemon=false

      - name: Print every failing test result XML
        if: failure()
        run: |
          set -e
          shopt -s globstar nullglob
          found=0
          for f in library/build/test-results/**/*.xml; do
            if grep -q "<failure\|<error" "$f"; then
              echo "::group::FAIL  $f"
              cat "$f"
              echo "::endgroup::"
              found=1
            fi
          done
          if [ "$found" = "0" ]; then
            echo "No XML with <failure> or <error> found under library/build/test-results"
            echo "Listing what is there:"
            find library/build/test-results -type f | head -200 || true
          fi

      - name: Upload all test reports + results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-test-reports
          path: |
            library/build/reports/tests/
            library/build/test-results/
            library/build/reports/problems/
