name: PR Title Lint

# Conventional Commits are required (AGENTS.md "Branching and Commit Rules").
# Squash-merge uses the PR title as the commit subject, so the title is what we gate.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          # type(optional-scope)optional-!: subject
          pattern="^(${types})(\([a-z0-9,. /-]+\))?!?: .+"
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title is not a valid Conventional Commit." >&2
            echo "Got:      $PR_TITLE" >&2
            echo "Expected: <type>(<optional scope>): <subject>" >&2
            echo "Types:    feat fix docs style refactor perf test build ci chore revert" >&2
            echo "Example:  feat(foundation): add PopBadge with status variants" >&2
            exit 1
          fi
          echo "PR title OK: $PR_TITLE"
