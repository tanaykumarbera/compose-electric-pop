name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "library/src/**"
      - "**/build.gradle.kts"
      - "gradle/libs.versions.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Dokka HTML
        run: ./gradlew :library:dokkaGenerate --stacktrace

      - name: Assemble Pages site (docs/ ∪ Dokka HTML)
        run: |
          rm -rf build/pages
          mkdir -p build/pages
          cp -R docs/. build/pages/
          mkdir -p build/pages/api
          cp -R library/build/dokka/html/. build/pages/api/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

      - id: deployment
        uses: actions/deploy-pages@v4
