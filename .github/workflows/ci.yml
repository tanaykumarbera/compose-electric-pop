name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-android:
    name: Desktop + Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: gradle/wrapper-validation-action@v3

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Lint + format check (Detekt + Spotless)
        run: ./gradlew detekt spotlessCheck --stacktrace

      - name: Screenshot KDoc tables in sync
        run: |
          ./gradlew :library:syncScreenshotKdoc --stacktrace
          if ! git diff --exit-code -- library/src/commonMain; then
            echo "::error::Screenshot KDoc tables are stale. Run ./gradlew :library:syncScreenshotKdoc and commit the result." >&2
            exit 1
          fi

      - name: Every component has light + dark snapshots
        run: ./gradlew :library:checkScreenshotPresence --stacktrace

      - name: Compile desktop + Android
        run: ./gradlew :library:compileKotlinDesktop :library:assembleRelease :demo:compileKotlinDesktop --stacktrace

      - name: Desktop unit tests
        run: ./gradlew :library:desktopTest --stacktrace

      - name: Verify Roborazzi screenshots
        run: ./gradlew :library:verifyRoborazziDesktop --stacktrace

      - name: Generate coverage report
        run: ./gradlew :library:koverXmlReport :library:koverHtmlReport --stacktrace

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./library/build/reports/kover/report.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: library/build/reports/kover/html/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload Roborazzi diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-diffs
          path: |
            library/build/outputs/roborazzi/
            library/build/reports/roborazzi/

  ios:
    name: iOS frameworks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Gradle + Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Build iOS frameworks (debug + release, arm64 + simulator)
        run: |
          ./gradlew \
            :library:linkDebugFrameworkIosArm64 \
            :library:linkDebugFrameworkIosSimulatorArm64 \
            :library:linkReleaseFrameworkIosArm64 \
            :library:linkReleaseFrameworkIosSimulatorArm64 \
            --stacktrace
